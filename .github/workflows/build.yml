name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the acoustics maths (no Minecraft needed)
        run: |
          mkdir -p /tmp/gson
          curl -sSL -o /tmp/gson/gson.jar https://repo1.maven.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar
          bash dev/selftest/run.sh /tmp/gson/gson.jar

      - name: Build the 26.3 Fabric jar
        run: |
          chmod +x gradlew
          ./gradlew :26.3-fabric:build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wavefront-jar
          path: versions/26.3-fabric/build/libs/*.jar
          if-no-files-found: error
