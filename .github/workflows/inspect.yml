name: Inspect Minecraft API

on:
  push:
    branches: [api-inspect]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :26.3-fabric:compileJava -q
      - name: Print classes
        run: |
          MC=""
          for j in $(find "$HOME/.gradle" "$GITHUB_WORKSPACE" -name "*.jar" 2>/dev/null); do
            case "$j" in *26.3*) ;; *) continue ;; esac
            if unzip -l "$j" 2>/dev/null | grep -q "net/minecraft/client/renderer/LevelRenderer.class"; then MC="$j"; echo "JAR=$j"; break; fi
          done
          test -n "$MC"
          echo "=== BEGIN"
          echo "--- Minecraft.runTick calls"
          javap -cp "$MC" -p -c net.minecraft.client.Minecraft | awk '/private void runTick\(boolean\)/,/^$/' | grep -E "invoke|athrow|goto" | sed 's/^ *//' | cut -c1-170 | sed -n 1,90p
          echo "--- Minecraft.tick calls mentioning sound or gizmo"
          javap -cp "$MC" -p -c net.minecraft.client.Minecraft | awk '/public void tick\(\)/,/^$/' | grep -E "invoke" | grep -iE "sound|gizmo|levelRenderer|LevelRenderer" | sed 's/^ *//' | cut -c1-170
          echo "--- who calls SoundManager.tick / SoundEngine.tick"
          for c in net.minecraft.client.Minecraft net.minecraft.client.sounds.SoundManager; do
            javap -cp "$MC" -p -c "$c" | grep -E "^  [a-z].*\(|SoundManager.tick|SoundEngine.tick" | grep -B1 -E "SoundManager.tick|SoundEngine.tick" | cut -c1-170
          done
          echo "--- Gizmos.addGizmo body"
          javap -cp "$MC" -p -c net.minecraft.gizmos.Gizmos | awk '/addGizmo\(/,/^$/' | grep -E "invoke|getstatic|areturn" | sed 's/^ *//' | cut -c1-170
          javap -cp "$MC" -p net.minecraft.gizmos.Gizmos | grep -E "static.*(ThreadLocal|collector)" 
          echo "--- getPerTickGizmos users"
          for c in net.minecraft.client.renderer.LevelRenderer net.minecraft.client.renderer.GameRenderer; do
            javap -cp "$MC" -p -c "$c" | grep -E "^  [a-z].*\(|getPerTickGizmos|addMainThreadGizmos|emitGizmos" | grep -B1 -E "getPerTickGizmos|addMainThreadGizmos|emitGizmos" | cut -c1-200
          done
          echo "=== END"
