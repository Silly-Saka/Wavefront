# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Mod properties
mod.name=Wavefront
mod.id=wavefront
mod.version=0.1.0
mod.group=com.redsmods.wavefront
mod.description=Sound physics for Minecraft: walls muffle by material, and sound bends round corners. Built on Sound Physics Perfected.
mod.source=https://github.com/Silly-Saka/Wavefront
mod.issues=https://github.com/Silly-Saka/Wavefront/issues
mod.license=GPL-3.0-only
mod.modrinth=https://github.com/Silly-Saka/Wavefront
mod.discord=https://github.com/Silly-Saka/Wavefront

# Publishing
publish.modrinth=
publish.curseforge=

# Dependencies
deps.fabric_loader_version=0.17.2
deps.devauth_version=1.2.1
deps.mixinconstraints_version=1.1.0
deps.mixinsquared_version=0.2.0
deps.yacl_version=3.7.1
deps.voicechat_api_version=2.6.0

# Build Plugins
# in libs.versions.toml

# Minecraft properties
mod.mc_dep=[VERSIONED]
mod.mc_version=[VERSIONED]

# Versioned
deps.parchment_version=[VERSIONED]
deps.fabric_api_version=[VERSIONED]
deps.modmenu_version=[VERSIONED]

deps.neoforge_version=[VERSIONED]
deps.forge_version=[VERSIONED]
